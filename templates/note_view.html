{% extends "base.html" %}
{% block content %}
<h1>{{ note.filename }}</h1>
<p class="muted">Uploaded {{ note.uploaded_at }}</p>
<div class="row"><a class="btn small" href="{{ url_for('notes') }}">Back to notes</a>
<a class="btn small" href="{{ url_for('note_file', nid=note.id) }}">Download original</a></div>
<pre class="card text">{{ note.content }}</pre>
{% endblock %}
